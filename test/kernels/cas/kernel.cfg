# cas: Format M's compare-and-swap (O-72, IS-21; OI-127) on .global and
# .shared: contended chains where every lane succeeds only in ascending lane
# order, contended words one lane wins, per-lane words half the lanes win,
# and a guarded CAS on lanes 0-15, whose rd and pd merge from their old names
# (A-43). DEC puts pd on the pair's second slot, beside rd; OOE's A2 writes
# it (OI-127), the lane computes it, and every pd is read by a guarded add.
# 32 threads, one warp. Checked against ccv-sim's reads, writes, old values
# and predicates, and by the cas-pd-first, cas-no-pd and cas-swap-always
# controls.
