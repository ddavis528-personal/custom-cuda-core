# retmiss (RI-18): a ret whose source is a load that misses L1, so OOE
# issues it on the load's speculated hit and replays it when the hit does
# not come. The speculated pass reads stale lanes and returns other lanes
# than its replay; the held ret check keys a pass by its active lanes, so
# the replay clears it. --break ret-held-by-lanes keys it by the lanes
# returned instead, and the speculated pass's failure stays.
# Each word is a lane's return address: 4140 is plus7, 4130 triple1, as
# the pinned assembler lays the code out.
SOURCE=core:test/kernels/retmiss/kernel.s
0x30000=4140
0x30004=4130
