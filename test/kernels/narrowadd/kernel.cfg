# narrowadd: narrow loads, stores, an add that carries and a subtract that
# borrows, and the widens after them, on full rows (AR-24's interim). The 0x
# lines are ccv-sim -poke arguments: the halfwords at 0x30000 (0xfff0,
# 0x0123) and 0x30004 (0x0001, 0x0002), and a pattern word at +16 to +28,
# so a store that writes past its element shows. OOE_CONFIG: every
# register a full row at position 0, its width code its own (DA tab rev 87).
SOURCE=core:test/kernels/narrowadd/kernel.s
OOE_CONFIG=full_rows=1
0x30000=19136496
0x30004=131073
0x30010=2779096485
0x30014=2779096485
0x30018=2779096485
0x3001c=2779096485
