# waypred: two lines in one L1 set under two tags, re-read alternately (MI-9 (3)).
# a at 0x30000 and b at 0x220000 are 31 ways' worth (64 KiB, one way of 512 sets
# of 128-byte lines) apart, so both are set 0, and their tags (3, 34) fold
# alike at 5 bits and at 1 (MA-26's XOR fold), so the predictor tells them apart
# only by recency. Checked by final register state against
# ccv-sim; under the DCU model with way prediction each re-read predicts the
# other way (dcu_wp_wrong), answered on the bank loser's path as a miss
# (AR 390, OA-442), which the MIU model takes late (l1_dcu_late).
