# waypred: two lines in one L1 set under two tags, re-read alternately (MI-9 (3)).
# a at 0x30000 and b at 0x300000 are a multiple of 64 KiB (one way of 512 sets
# of 128-byte lines) apart, so both are set 0, and their tags, PA[47:16] (3,
# 48), fold alike at 4 bits (3 = 0 ^ 3; MA-30's fold, sim/skel/wayfold.h) and
# at 1, so the predictor cannot tell them apart. Checked by final register
# state against ccv-sim; under the DCU model with way prediction (index: the
# lowest matching way, MA-30, AR 405) each re-read of b, in the higher way,
# predicts a's (dcu_wp_wrong), answered on the bank loser's path as a miss
# (AR 390, OA-442), which the MIU model takes late (l1_dcu_late).
