# atomf: O-76's atom.add.f32 on .global and .shared (IS-21; CP-81), the
# compiler's test/atomics-fadd.s. 32 lanes add to one word: lane 0 2^24,
# the rest 1.0 (window 12, poked below). In ascending lane order every
# 2^24 + 1 ties and rounds to even, so both sums stay 0x4B800000 and every
# lane but 0 reads 2^24; any other order gives 0x4B800010. So it holds MIU's
# ascending-lane passes (AR-21, V-72) with a check that can fail: the
# atom-descending control. 32 threads, one warp.
