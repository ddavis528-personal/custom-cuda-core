# §8: "CI is a Stage 1 concern, not a Stage 7 one... On a solo project this is
# the single piece of infrastructure whose absence compounds fastest."
#
# One job, one gate. tools/verify.sh is the whole contract -- this file exists
# to install the toolchain and run it, and should never accumulate checks of
# its own. A check that lives only in CI cannot be run before pushing, which
# is when it would actually save time.
name: verify

on:
  push:
    # gate-scratch/* carries a split gate's unverified commit and its export
    # between containers (tools/gate-scratch.sh); its gate is the split one.
    branches-ignore: ["gate-scratch/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. The gate checks pinned tool VERSIONS in seconds; this re-measures
    # what the tools actually DO, which is the only thing that notices a
    # limitation lifting. Runners drift on their own schedule, so a cron is the
    # trigger rather than a push.
    - cron: "17 4 * * 1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is the one tools/setup-toolchain.sh installs, so CI and
      # every container run the gate on the same pinned versions. CI once
      # kept its own apt list, which went on installing Debian's Verilator
      # after the gate moved to a release built from source (OI-40), and an
      # unpinned SymbiYosys. Verilator's build is cached by its tag.
      - name: Verilator tag
        id: vl
        run: echo "tag=$(sed -n 's/^VERILATOR_TAG=//p' tools/setup-toolchain.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-${{ steps.vl.outputs.tag }}
          key: verilator-${{ steps.vl.outputs.tag }}-${{ runner.os }}

      - name: Install toolchain
        run: VERILATOR_PREFIX="$HOME/verilator-${{ steps.vl.outputs.tag }}" ./tools/setup-toolchain.sh

      # A runner has 4 cores and 16 GB; full-size ooe_rob's Yosys and ABC
      # take about 6 GB each, and check-cg's and check-ngd's ran side by side
      # and killed the runner (runs 538, 543, 544). CCV_HEAVY_SERIAL measures
      # each unit tools/heavy-units.json names alone (DA, 2026-11-01); it is
      # the default everywhere now, set here so CI never depends on that.
      - name: Verify
        env:
          CCV_HEAVY_SERIAL: "1"
        run: ./tools/verify.sh

      # Separate job-step rather than part of the gate: re-measuring takes
      # minutes. A changed cell is a finding to read, not a build to fix --
      # and a cell going FAIL -> PASS matters as much as the reverse, because
      # several decisions exist because of a limitation that may have lifted.
      - name: Tool-matrix drift
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check-matrix-drift.py
